{{define "main"}}
<section class="contact-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-10 mx-auto col-md-12">
        <div class="page-header">
          <h2> {{ .Title }}</h2>
          <p>{{.Params.subTitle}}</p>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <div class="contact-form">
          <h2>Formulario de Contacto</h2>

          <form id="contact-form" action="https://formspree.io/f/{{ .Site.Params.formspreeID }}" method="POST">
            <div class="form-group">
              <label for="name">Nombre y apellido *</label>
              <input type="text" class="form-control" id="name" name="name" placeholder="Juan García" required />
            </div>
            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="juan@empresa.com" required />
            </div>
            <div class="form-group">
              <label for="company">Empresa / Edificio</label>
              <input type="text" class="form-control" id="company" name="company" placeholder="Nombre de su empresa" />
            </div>
            <div class="form-group">
              <label for="phone">Teléfono</label>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="+54 11 XXXX-XXXX" />
            </div>
            <div class="form-group">
              <label for="message">Consulta *</label>
              <textarea class="form-control" id="message" name="message" rows="5"
                placeholder="Contanos brevemente qué necesitás..." required></textarea>
            </div>
            <div id="contact-form-status"></div>
            <button type="submit" id="contact-form-button" class="btn btn-primary">Enviar consulta</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>
{{end}}
